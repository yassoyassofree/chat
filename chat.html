<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Mode Chat Application</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #00ff00;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid #00ff00;
        }
        .navbar .logo {
            font-size: 1.8em;
            margin: 0;
            color: #00ff00;
        }
        .nav-links {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 20px; /* Gap between menu items */
        }
        .nav-links li {
            display: inline;
        }
        .nav-links a {
            color: #00ff00;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        .nav-links a:hover {
            background-color: #00ff00;
            color: #000;
        }
        .chat-container {
            display: flex;
        }
        .sidebar {
            width: 200px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-right: 2px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        .chat-area {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        .messages {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        .input-area {
            display: flex;
        }
        .input-area input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #00ff00;
            border-radius: 5px;
            background-color: #1a1a1a;
            color: #00ff00;
        }
        .input-area button {
            margin-left: 10px;
            padding: 10px;
            background-color: #00ff00;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #000;
        }
        .input-area button:hover {
            background-color: #009900;
            color: #fff;
        }
        .user-list {
            width: 200px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-left: 2px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1 class="logo">Blooket Hacker Mode</h1>
        <ul class="nav-links">
            <li><a href="chat.html">Chat</a></li>
            <li><a href="cheats.html">Cheats</a></li>
            <li><a href="chose.html">Choose</a></li>
            <li><a href="unblockers.html">Unblockers</a></li>
        </ul>
    </div>
    
    <div class="chat-container">
        <div class="sidebar">
            <h3>Channels</h3>
            <ul id="channelList">
                <li># general</li>
                <li># random</li>
                <li># tech</li>
            </ul>
        </div>
        <div class="chat-area">
            <div id="messages" class="messages"></div>
            <div class="input-area">
                <input type="text" id="message" placeholder="Type your message..." autocomplete="off">
                <button id="sendButton">Send</button>
            </div>
        </div>
        <div class="user-list" id="userList"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
