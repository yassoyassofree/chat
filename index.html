    <body>
        
        <div class="login-container">
            <h2>Login to the Matrix</h2>
            <form class="login-form" onsubmit="return validateForm()">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
    
                <button type="submit">Access</button>
                <div class="error-message" id="error-message"></div>
            </form>
            <p>Don't have an account? <a href="regester.html" style="color: #00ff00;">Register here</a></p>
            
        </div>
    
        <script>
            function validateForm(event) {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorMessage = document.getElementById('error-message');
    
                if (username === "" || password === "") {
                    errorMessage.textContent = "Please enter both username and password.";
                    return false;
                }
    
                // Retrieve saved username and password from LocalStorage
                const savedUsername = localStorage.getItem('username');
                const savedPassword = localStorage.getItem('password');
    
                if (username === savedUsername && password === savedPassword) {
                    // Redirect to welcome page if credentials are correct
                    window.location.href = "pin.html";
                    return false; // Prevent default form submission
                } else {
                    errorMessage.textContent = "Incorrect username or password. Please try again.";
                    return false; // Prevent default form submission
                }
    
                event.preventDefault(); // Prevent default form submission
    
                return true;
            }
        </script>
